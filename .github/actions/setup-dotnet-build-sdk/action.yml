name: 'Setup build .NET SDK'
description: >-
  Installs the newest SDK, previews included, on the channel of global.json's sdk.version.
  global.json (rollForward latestFeature, allowPrerelease) then selects it, so CI moves from
  a preview to the GA SDK without editing the pin.
runs:
  using: 'composite'
  steps:
    - name: Read SDK channel from global.json
      id: channel
      shell: bash
      run: |
        version=$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([0-9]*\.[0-9]*\)\..*/\1/p' global.json | head -1)
        if [ -z "$version" ]; then
          echo "::error::global.json has no sdk.version"
          exit 1
        fi
        echo "channel=$version.x" >> "$GITHUB_OUTPUT"
        echo "Build SDK channel: $version.x (previews allowed)"

    - name: Setup build .NET SDK
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ steps.channel.outputs.channel }}
        dotnet-quality: preview

    - name: Show selected SDK
      shell: bash
      run: dotnet --version
