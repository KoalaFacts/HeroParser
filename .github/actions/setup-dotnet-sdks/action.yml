name: 'Setup .NET SDKs'
description: 'Sets up .NET SDKs with caching support'
inputs:
  dotnet-version:
    description: 'SDK version(s) to install (newline-separated)'
    required: true
  cache:
    description: 'Enable caching of NuGet packages'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    # The build SDK goes first: global.json requires it, and the cache step below
    # runs `dotnet nuget locals`, which fails until a matching SDK is installed.
    - name: Setup build .NET SDK
      uses: ./.github/actions/setup-dotnet-build-sdk

    - name: Setup .NET SDKs
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
        cache: ${{ inputs.cache }}
        cache-dependency-path: '**/*.csproj'

    - name: Install WebAssembly workload
      run: dotnet workload install wasm-tools
      shell: bash
