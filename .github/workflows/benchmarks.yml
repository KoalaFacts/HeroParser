name: Performance Benchmarks

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'benchmarks/**'
      - '.github/workflows/benchmarks.yml'
      - 'Directory.Build.*'
      - 'Directory.Packages.props'
      - 'global.json'
  workflow_dispatch:
    inputs:
      pipe_profile:
        description: 'Run only independent warmed managed-stack and JIT diagnostics (not A/B acceptance)'
        type: boolean
        default: false
      pipe_native_profile:
        description: 'Collect native on-CPU/JIT evidence for the frozen failed segmented workload; never A/A or A/B'
        type: boolean
        default: false
      pipe_native_replay_run:
        description: 'With native profile: replay retained artifact from this run instead of launching any workload'
        type: string
        default: ''
      pipe_native_history_probe:
        description: 'With native profile: collect both fixed preparation histories once, diagnostic only; with replay select their retained subdirectories'
        type: boolean
        default: false
      pipe_history:
        description: 'Replay the hash-pinned failed batch history in four fixed process pairs; diagnostic only, no acceptance'
        type: boolean
        default: false
      pipe_history_replay_run:
        description: 'With history mode: analyze the retained capture without launching measured workers'
        type: string
        default: ''
      pipe_history_jit_control:
        description: 'With history mode: four fixed pairs changing only the EventPipe JIT keyword, not PGO or parser code'
        type: boolean
        default: false
      pipe_history_same_run:
        description: 'Six fixed same-runner pairs with reference and positive controls; no retries or acceptance'
        type: boolean
        default: false
      pipe_bias:
        description: 'Run only fixed same-source module/self/swap bias diagnostics and separate JIT output; not acceptance'
        type: boolean
        default: false
      pipe_bias_jit_only:
        description: 'With pipe_bias: collect only two side-labelled JIT processes, not timing controls'
        type: boolean
        default: false
      baseline_sha:
        description: 'Full baseline commit SHA for the paired pipe experiment'
        type: string
        default: '5c549d193a510a06fa24e23627b23a2df0cf0188'

# Queue revisions in the same group; do not interrupt an active benchmark capture.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}-${{ (inputs.pipe_history || inputs.pipe_history_replay_run != '' || inputs.pipe_history_jit_control || inputs.pipe_history_same_run) && 'history' || inputs.pipe_native_profile && 'native-profile' || (inputs.pipe_bias || inputs.pipe_bias_jit_only) && 'bias' || inputs.pipe_profile && 'profile' || 'normal' }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  setup:
    if: github.event_name != 'workflow_dispatch' || (!inputs.pipe_history && !inputs.pipe_history_replay_run && !inputs.pipe_history_jit_control && !inputs.pipe_history_same_run && !inputs.pipe_profile && !inputs.pipe_native_profile && !inputs.pipe_native_replay_run && !inputs.pipe_native_history_probe && !inputs.pipe_bias && !inputs.pipe_bias_jit_only)
    name: Extract Build Configuration
    runs-on: ubuntu-latest
    outputs:
      frameworks: ${{ steps.extract.outputs.frameworks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract configuration
        id: extract
        uses: ./.github/actions/extract-build-config

  benchmark:
    needs: setup
    permissions:
      contents: read
      pull-requests: write
    name: Run Performance Benchmarks
    runs-on: ubuntu-latest  # Consistent environment for comparisons
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Extract configuration
      id: extract
      uses: ./.github/actions/extract-build-config

    - name: Setup all .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ steps.extract.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore --force-evaluate

    - name: Build benchmarks
      run: |
        dotnet build benchmarks/HeroParser.Benchmarks/HeroParser.Benchmarks.csproj \
          --configuration Release \
          --framework ${{ matrix.framework }} \
          --no-restore

    - name: Run benchmarks
      run: |
        cd benchmarks/HeroParser.Benchmarks
        dotnet run -c Release \
          --framework ${{ matrix.framework }} \
          --no-build \
          -- --throughput

    # ---------------------------------------------------------------------------
    # Same-runner A/B for the Sep comparison (pull requests, net10.0 only).
    # GitHub-hosted runners land on different CPUs from run to run, so numbers
    # from separate runs are not comparable. Building the PR base commit in a
    # worktree and running both sides in this job removes the hardware lottery.
    # ---------------------------------------------------------------------------
    - name: Build base commit for A/B
      if: github.event_name == 'pull_request' && matrix.framework == 'net10.0' && github.event.pull_request.head.repo.fork == false
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        git fetch --no-tags --depth=1 origin "$BASE_SHA"
        git worktree add "$RUNNER_TEMP/base" "$BASE_SHA"
        cd "$RUNNER_TEMP/base"
        dotnet restore --force-evaluate
        dotnet build benchmarks/HeroParser.Benchmarks/HeroParser.Benchmarks.csproj \
          --configuration Release \
          --framework ${{ matrix.framework }} \
          --no-restore

    - name: Run same-runner comparisons on base and head
      if: github.event_name == 'pull_request' && matrix.framework == 'net10.0' && github.event.pull_request.head.repo.fork == false
      run: |
        ROOT="$GITHUB_WORKSPACE/benchmarks/HeroParser.Benchmarks/BenchmarkDotNet.Artifacts"

        # group flag | artifact directory | BenchmarkDotNet filter | extra BenchmarkDotNet args. Each entry
        # runs base then head so both share the runner. The pipe group runs only the row-level PipeReader
        # benchmark: the typed one would double the job time and its report file would collide with the
        # first in the comment. The avx2 entry re-runs the Sep comparison with AVX-512 disabled in the
        # benchmark process so the AVX2 code path is measured on every runner, not only on Zen 3 ones.
        for entry in \
          "--vs-sep-reading|vs-sep|*|" \
          "--vs-sep-reading|vs-sep-avx2|*|--envVars DOTNET_EnableAVX512:0" \
          "--csv-streaming|streaming|*|" \
          "--csv-pipe|pipe|*CsvPipeReaderBenchmarks*|"; do
          IFS='|' read -r GROUP DIR FILTER EXTRA <<< "$entry"

          cd "$RUNNER_TEMP/base/benchmarks/HeroParser.Benchmarks"
          dotnet run -c Release \
            --framework ${{ matrix.framework }} \
            --no-build \
            -- "$GROUP" --filter "$FILTER" --artifacts "$ROOT/$DIR/base" $EXTRA

          cd "$GITHUB_WORKSPACE/benchmarks/HeroParser.Benchmarks"
          dotnet run -c Release \
            --framework ${{ matrix.framework }} \
            --no-build \
            -- "$GROUP" --filter "$FILTER" --artifacts "$ROOT/$DIR/head" $EXTRA
        done

    - name: Upload benchmark results
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: benchmark-results-${{ matrix.framework }}
        path: |
          benchmarks/HeroParser.Benchmarks/BenchmarkDotNet.Artifacts/**/*
        retention-days: 30

    - name: Comment benchmark results on PR
      if: github.event_name == 'pull_request' && matrix.framework == 'net10.0' && github.event.pull_request.head.repo.fork == false
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          const artifactsRoot = 'benchmarks/HeroParser.Benchmarks/BenchmarkDotNet.Artifacts';

          // Returns the GitHub-flavoured markdown report BenchmarkDotNet wrote into
          // <dir>/results, or null when the directory or report is missing.
          function readReport(dir) {
            const resultsDir = path.join(dir, 'results');
            if (!fs.existsSync(resultsDir)) return null;
            const file = fs.readdirSync(resultsDir).find(f => f.includes('github') && f.endsWith('.md'));
            return file ? fs.readFileSync(path.join(resultsDir, file), 'utf8') : null;
          }

          const sections = [];

          const throughput = readReport(artifactsRoot);
          if (throughput) {
            sections.push(`## Benchmark Results (${{ matrix.framework }})\n\n${throughput}`);
          }

          const short = sha => sha.slice(0, 7);
          const comparisons = [
            { dir: 'vs-sep', title: 'Sep Comparison, same runner' },
            { dir: 'vs-sep-avx2', title: 'Sep Comparison, same runner, AVX-512 disabled (AVX2 path)' },
            { dir: 'streaming', title: 'Streaming Comparison, same runner' },
            { dir: 'pipe', title: 'PipeReader Comparison, same runner' },
          ];
          for (const { dir, title } of comparisons) {
            const base = readReport(path.join(artifactsRoot, dir, 'base'));
            const head = readReport(path.join(artifactsRoot, dir, 'head'));
            if (base && head) {
              sections.push(
                `## ${title} (${{ matrix.framework }})\n\n` +
                `Both sides ran back to back in this job, so the hardware header below applies to both.\n\n` +
                `<details><summary>Base ${short(process.env.BASE_SHA)}</summary>\n\n${base}\n</details>\n\n` +
                `<details open><summary>Head ${short(process.env.HEAD_SHA)}</summary>\n\n${head}\n</details>`
              );
            }
          }

          if (sections.length > 0) {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: sections.join('\n\n')
            });
          }

  # Ordinary CI verifies current code and publishes only current correctness evidence.
  pipe-correctness:
    needs: setup
    name: CSV Pipe Correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}
    steps:
      - name: Checkout exact current source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Test CI scope and status policy
        id: policy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        with:
          script: |
            require('node:child_process').execFileSync(process.execPath,
              ['--test', 'benchmarks/CsvPipeABProbe/test-ci-status.ts'], { stdio: 'inherit' });

      - name: Test synthetic control validators without timing workers
        id: controls
        shell: pwsh
        run: ./benchmarks/CsvPipeABProbe/test-control.ps1

      - name: Extract configuration
        id: extract
        uses: ./.github/actions/extract-build-config

      - name: Setup all .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks
        with:
          dotnet-version: ${{ steps.extract.outputs.versions }}

      - name: Restore correctness tests
        run: dotnet restore --force-evaluate

      - name: Build correctness tests
        id: build
        run: dotnet build tests/HeroParser.Tests/HeroParser.Tests.csproj --configuration Release --no-restore --framework ${{ matrix.framework }}

      - name: Run current CSV Pipe correctness tests without timing
        id: tests
        run: >
          dotnet test tests/HeroParser.Tests
          --configuration Release --no-build
          --framework ${{ matrix.framework }}
          --
          --filter-class "*CsvPipe*" "HeroParser.Tests.PipeReaderTests"
          --minimum-expected-tests 1
          --fail-skips on
          --report-trx --report-trx-filename csv-pipe.trx
          --results-directory ./TestResults/pipe

      - name: Validate non-empty current test evidence
        id: evidence
        if: always()
        shell: pwsh
        run: ./.github/scripts/validate-test-results.ps1 -Path 'TestResults/pipe/csv-pipe.trx'

      - name: Report current correctness
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0 (Node 24)
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          FRAMEWORK: ${{ matrix.framework }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          POLICY_OUTCOME: ${{ steps.policy.outcome }}
          CONTROLS_OUTCOME: ${{ steps.controls.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          EVIDENCE_OUTCOME: ${{ steps.evidence.outcome }}
        with:
          script: |
            const fs = require('node:fs');
            const { createCiStatus } = require(`${process.env.GITHUB_WORKSPACE}/benchmarks/CsvPipeABProbe/ci-status.ts`);
            const report = createCiStatus({
              sourceSha: process.env.SOURCE_SHA, framework: process.env.FRAMEWORK,
              runId: process.env.RUN_ID, runAttempt: process.env.RUN_ATTEMPT,
              outcomes: {
                policy: process.env.POLICY_OUTCOME, controls: process.env.CONTROLS_OUTCOME,
                build: process.env.BUILD_OUTCOME, tests: process.env.TESTS_OUTCOME,
                evidence: process.env.EVIDENCE_OUTCOME,
              },
            });
            fs.mkdirSync('BenchmarkDotNet.Artifacts/pipe-ci', { recursive: true });
            fs.writeFileSync('BenchmarkDotNet.Artifacts/pipe-ci/status.json', JSON.stringify(report, null, 2) + '\n');
            await core.summary.addRaw(report.markdown).write();
            if (!report.checkPassed) core.setFailed(`CSV Pipe correctness prerequisites did not pass: ${report.failedPrerequisites.join(', ')}`);

      - name: Upload current correctness evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csv-pipe-correctness-${{ matrix.framework }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            TestResults/pipe/**
            BenchmarkDotNet.Artifacts/pipe-ci/**
          if-no-files-found: error
          retention-days: 30

  pipe-profile:
    if: github.event_name == 'workflow_dispatch' && inputs.pipe_profile && !inputs.pipe_history && !inputs.pipe_history_replay_run && !inputs.pipe_history_jit_control && !inputs.pipe_history_same_run && !inputs.pipe_bias && !inputs.pipe_native_profile && !inputs.pipe_native_history_probe
    name: CSV Pipe Managed Stack and JIT Diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Install verified trace tool release
        shell: bash
        run: dotnet tool install dotnet-trace --tool-path "$RUNNER_TEMP/trace-tools" --version 10.0.745401

      - name: Validate scripts and record diagnostic context
        shell: pwsh
        run: |
          ./benchmarks/CsvPipeABProbe/test-control.ps1
          New-Item -ItemType Directory -Path BenchmarkDotNet.Artifacts -Force | Out-Null
          lscpu > BenchmarkDotNet.Artifacts/profile-runner-context.txt
          dotnet --info >> BenchmarkDotNet.Artifacts/profile-runner-context.txt

      - name: Collect serial warmed stacks and separate JIT output
        shell: pwsh
        env:
          BASELINE_SHA: ${{ inputs.baseline_sha }}
        run: |
          ./benchmarks/CsvPipeABProbe/profile.ps1 -BaselineSha $env:BASELINE_SHA -Workspace "$env:RUNNER_TEMP/pipe-profile" -TraceTool "$env:RUNNER_TEMP/trace-tools/dotnet-trace"

      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csv-pipe-profile-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            BenchmarkDotNet.Artifacts/pipe-profile/**
            BenchmarkDotNet.Artifacts/profile-runner-context.txt
          retention-days: 30

  pipe-bias:
    if: github.event_name == 'workflow_dispatch' && !inputs.pipe_history && !inputs.pipe_history_replay_run && !inputs.pipe_history_jit_control && !inputs.pipe_history_same_run && !inputs.pipe_native_profile && !inputs.pipe_native_history_probe && (inputs.pipe_bias || inputs.pipe_bias_jit_only)
    name: CSV Pipe Same-Source Bias Diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require one diagnostic mode
        shell: pwsh
        env:
          OTHER_MODES: ${{ inputs.pipe_profile }}
          BIAS_MODE: ${{ inputs.pipe_bias }}
        run: |
          if ($env:OTHER_MODES -eq 'true') { throw 'pipe_bias cannot be combined with other manual experiment modes.' }
          if ($env:BIAS_MODE -ne 'true') { throw 'pipe_bias_jit_only requires pipe_bias.' }

      - name: Checkout exact diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Validate scripts and record runner context
        shell: pwsh
        run: |
          ./benchmarks/CsvPipeABProbe/test-control.ps1
          New-Item -ItemType Directory -Path BenchmarkDotNet.Artifacts -Force | Out-Null
          lscpu > BenchmarkDotNet.Artifacts/bias-runner-context.txt
          dotnet --info >> BenchmarkDotNet.Artifacts/bias-runner-context.txt

      - name: Run fixed serial module-routing experiment
        shell: pwsh
        env:
          SOURCE_SHA: ${{ github.sha }}
          JIT_ONLY: ${{ inputs.pipe_bias_jit_only }}
        run: |
          $jitOnly = $env:JIT_ONLY -eq 'true'
          ./benchmarks/CsvPipeABProbe/run-series.ps1 -BaselineSha $env:SOURCE_SHA -Workspace "$env:RUNNER_TEMP/pipe-bias" -OutputDirectory BenchmarkDotNet.Artifacts/pipe-bias -BiasDiagnostics -BiasJitOnly:$jitOnly

      - name: Upload diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: csv-pipe-bias-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            BenchmarkDotNet.Artifacts/pipe-bias/**
            BenchmarkDotNet.Artifacts/bias-runner-context.txt
          retention-days: 30

  pipe-history:
    if: github.event_name == 'workflow_dispatch' && (inputs.pipe_history || inputs.pipe_history_replay_run != '' || inputs.pipe_history_jit_control || inputs.pipe_history_same_run)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/csv-pipe-history.yml
    with:
      other_modes: ${{ inputs.pipe_profile || inputs.pipe_bias || inputs.pipe_bias_jit_only || inputs.pipe_native_profile || inputs.pipe_native_replay_run != '' || inputs.pipe_native_history_probe }}
      replay_run: ${{ inputs.pipe_history_replay_run }}
      jit_event_control: ${{ inputs.pipe_history_jit_control }}
      same_run_control: ${{ inputs.pipe_history_same_run }}

  pipe-native-profile:
    if: github.event_name == 'workflow_dispatch' && !inputs.pipe_history && !inputs.pipe_history_replay_run && !inputs.pipe_history_jit_control && !inputs.pipe_history_same_run && (inputs.pipe_native_profile || inputs.pipe_native_replay_run || inputs.pipe_native_history_probe)
    name: CSV Pipe Native CPU and JIT Evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require isolated diagnostic mode
        shell: pwsh
        env:
          OTHER_MODES: ${{ inputs.pipe_profile || inputs.pipe_bias || inputs.pipe_bias_jit_only }}
          NATIVE_MODE: ${{ inputs.pipe_native_profile }}
        run: |
          if ($env:OTHER_MODES -eq 'true') { throw 'Native diagnostics cannot be combined with timing or legacy diagnostics.' }
          if ($env:NATIVE_MODE -ne 'true') { throw 'Native artifact replay requires pipe_native_profile.' }
      - name: Checkout diagnostic source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Install native profiling tools
        shell: bash
        run: |
          mkdir -p BenchmarkDotNet.Artifacts/pipe-native
          sudo apt-get update 2>&1 | tee BenchmarkDotNet.Artifacts/pipe-native/tools-update.txt
          sudo apt-get install -y linux-tools-generic binutils 2>&1 | tee BenchmarkDotNet.Artifacts/pipe-native/tools-install.txt
          PERF=$(find -L /usr/lib/linux-tools -type f -name perf | sort -V | tail -1)
          test -n "$PERF"
          "$PERF" --version
          echo "HERO_PARSER_PERF=$PERF" >> "$GITHUB_ENV"
      - name: Validate diagnostics and capture runner context
        shell: pwsh
        run: |
          ./benchmarks/CsvPipeABProbe/test-control.ps1
          ./benchmarks/CsvPipeABProbe/test-native-profile.ps1
          New-Item -ItemType Directory -Path BenchmarkDotNet.Artifacts/pipe-native -Force | Out-Null
          lscpu > BenchmarkDotNet.Artifacts/pipe-native/runner-context.txt
          uname -a >> BenchmarkDotNet.Artifacts/pipe-native/runner-context.txt
          dotnet --info >> BenchmarkDotNet.Artifacts/pipe-native/runner-context.txt
          Get-Content /proc/sys/kernel/perf_event_paranoid >> BenchmarkDotNet.Artifacts/pipe-native/runner-context.txt
      - name: Collect fixed native evidence without timing retrials
        shell: pwsh
        env:
          PROFILE_RUN: ${{ inputs.pipe_native_replay_run }}
          HISTORY_PROBE: ${{ inputs.pipe_native_history_probe }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ($env:PROFILE_RUN) {
            if ($env:PROFILE_RUN -notmatch '^\d+$') { throw 'Invalid native artifact run ID.' }
            gh run download $env:PROFILE_RUN --repo $env:GITHUB_REPOSITORY -n "csv-pipe-native-$($env:PROFILE_RUN)-1" -D "$env:RUNNER_TEMP/native-input"
            if ($LASTEXITCODE -ne 0) { throw 'Could not download retained native evidence.' }
            if ($env:HISTORY_PROBE -eq 'true') {
              foreach ($history in @('SegmentedOnly', 'ContiguousPrelude')) {
                ./benchmarks/CsvPipeABProbe/native-replay.ps1 -InputDirectory "$env:RUNNER_TEMP/native-input/$history" -PerfTool $env:HERO_PARSER_PERF -OriginRun $env:PROFILE_RUN -OutputDirectory "BenchmarkDotNet.Artifacts/pipe-native/replay/$history"
              }
            } else {
              ./benchmarks/CsvPipeABProbe/native-replay.ps1 -InputDirectory "$env:RUNNER_TEMP/native-input" -PerfTool $env:HERO_PARSER_PERF -OriginRun $env:PROFILE_RUN
            }
            exit 0
          }
          if ($env:HISTORY_PROBE -eq 'true') {
            $results = @()
            foreach ($history in @('SegmentedOnly', 'ContiguousPrelude')) {
              try {
                ./benchmarks/CsvPipeABProbe/native-profile.ps1 -WorkloadSha 89c06810e76c4623ebad3cfc89c4bcdef41acd59 -Workspace "$env:RUNNER_TEMP/pipe-native-$history" -PerfTool $env:HERO_PARSER_PERF -OutputDirectory "BenchmarkDotNet.Artifacts/pipe-native/$history" -PreparationHistory $history
                $results += @{ History = $history; Complete = $true }
              } catch {
                $results += @{ History = $history; Complete = $false; Error = $_.Exception.Message }
              }
            }
            $results | ConvertTo-Json | Set-Content BenchmarkDotNet.Artifacts/pipe-native/history-probe.json
            if (@($results | Where-Object { !$_.Complete }).Count) { throw 'Fixed history diagnosis incomplete; no retry or acceptance.' }
            exit 0
          }
