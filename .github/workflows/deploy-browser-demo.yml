name: Deploy Browser Demo

on:
  # Validate the exact PR head without granting Pages deployment privileges.
  pull_request:
    paths:
      - 'npm/**'
      - 'src/HeroParser.Wasm/**'
      # Demo publishes the core library and its analyzer, not only the WASM wrapper.
      - 'src/HeroParser/**'
      - 'src/HeroParser.Generators/**'
      - '.github/workflows/deploy-browser-demo.yml'
      # SDK/global build changes can break the net10 WASM build even without changes in npm/.
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/actions/setup-dotnet-build-sdk/**'
  push:
    branches:
      - main
    paths:
      - 'npm/**'
      - 'src/HeroParser.Wasm/**'
      # Demo publishes the core library and its analyzer, not only the WASM wrapper.
      - 'src/HeroParser/**'
      - 'src/HeroParser.Generators/**'
      - '.github/workflows/deploy-browser-demo.yml'
      # SDK/global build changes can break the net10 WASM build even without changes in npm/.
      - 'global.json'
      - 'Directory.Build.props'
      - '.github/actions/setup-dotnet-build-sdk/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  validate-demo:
    name: Validate browser demo (no deployment)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup build .NET SDK
        uses: ./.github/actions/setup-dotnet-build-sdk
      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly tools for net10.0 under the .NET 11 SDK
        run: dotnet workload install wasm-tools-net10

      - name: Publish WASM project
        run: dotnet publish src/HeroParser.Wasm/HeroParser.Wasm.csproj -c Release -p:IsWasmBuildJob=true

      - name: Copy WASM assets to npm package
        run: |
          mkdir -p npm/packages/heroparser/_framework
          cp -r src/HeroParser.Wasm/bin/Release/net10.0/publish/wwwroot/_framework/* npm/packages/heroparser/_framework/
          rm -f npm/packages/heroparser/_framework/*.dat
          rm -f npm/packages/heroparser/_framework/*.br
          rm -f npm/packages/heroparser/_framework/*.gz

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'npm/package-lock.json'

      - name: Upgrade npm
        run: |
          npm install --global npm@12
          npm --version

      - name: Install workspace dependencies
        run: npm ci --prefix npm --legacy-peer-deps

      - name: Build browser demo
        run: npm run build --prefix npm --workspace=browser-demo --legacy-peer-deps

  build-and-deploy:
    # PRs build without GitHub Pages writes; only trusted main pushes/manual runs deploy.
    if: github.event_name != 'pull_request'
    name: Build and Deploy Demo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup build .NET SDK
        uses: ./.github/actions/setup-dotnet-build-sdk
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Install WebAssembly tools for net10.0 under the .NET 11 SDK
        run: dotnet workload install wasm-tools-net10

      - name: Publish WASM project
        run: dotnet publish src/HeroParser.Wasm/HeroParser.Wasm.csproj -c Release -p:IsWasmBuildJob=true

      - name: Copy WASM assets to npm package
        run: |
          mkdir -p npm/packages/heroparser/_framework
          cp -r src/HeroParser.Wasm/bin/Release/net10.0/publish/wwwroot/_framework/* npm/packages/heroparser/_framework/
          # Remove ICU databases and compressed duplicates to reduce package size
          rm -f npm/packages/heroparser/_framework/*.dat
          rm -f npm/packages/heroparser/_framework/*.br
          rm -f npm/packages/heroparser/_framework/*.gz


      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'npm/package-lock.json'

      - name: Upgrade npm
        run: |
          npm install --global npm@12
          npm --version

      - name: Install workspace dependencies
        run: npm ci --prefix npm --legacy-peer-deps

      - name: Build browser demo
        run: npm run build --prefix npm --workspace=browser-demo --legacy-peer-deps

      - name: Deploy to gh-pages
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Clone gh-pages branch
          git clone --branch gh-pages https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git /tmp/gh-pages
          
          # Recreate demo directory in gh-pages clone
          rm -rf /tmp/gh-pages/demo
          mkdir -p /tmp/gh-pages/demo
          
          # Copy compiled files
          cp -r npm/examples/browser-demo/dist/* /tmp/gh-pages/demo/
          
          # Commit and Push
          cd /tmp/gh-pages
          git add demo/
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: deploy WASM browser demo from commit ${{ github.sha }}"
            git push origin gh-pages
            echo "Successfully deployed demo to GitHub Pages!"
          else
            echo "No changes in demo files detected. Skipping deployment."
          fi
