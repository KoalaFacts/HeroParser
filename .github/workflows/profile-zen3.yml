name: Profile on a chosen CPU

# GitHub-hosted runners land on different CPUs (EPYC 7763 Zen 3, EPYC 9V74 Zen 4, Xeon 6973P-C).
# This workflow starts several jobs at once; each checks its CPU model and only the ones matching the
# requested pattern profile, so one dispatch almost always yields at least one hit. Each hit runs the
# Sep-comparison workloads in a loop under Linux perf with .NET JIT dumps enabled, so the reports
# resolve JIT-compiled methods and annotate instructions inside them.

on:
  workflow_dispatch:
    inputs:
      cpu:
        description: Regex the CPU model name must match (e.g. 7763 for Zen 3, 9V74 for Zen 4, 6973P for the Xeon)
        required: true
        default: '7763'
      cases:
        description: Space-separated profile cases (hero-utf8 hero-utf16 sep-utf16, each optionally -quoted)
        required: true
        default: 'hero-utf8 hero-utf16 sep-utf16'
      seconds:
        description: Seconds to loop each case under the profiler
        required: true
        default: '8'
      jobs:
        description: Number of parallel jobs to start (more jobs, better odds of drawing the CPU)
        required: true
        default: '6'

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  plan:
    name: Fan out
    runs-on: ubuntu-latest
    outputs:
      instances: ${{ steps.fan.outputs.instances }}
    steps:
      - id: fan
        run: |
          n='${{ inputs.jobs }}'
          echo "instances=$(seq -s, 1 "$n" | sed 's/^/[/; s/$/]/')" >> "$GITHUB_OUTPUT"

  profile:
    needs: plan
    name: Profile (instance ${{ matrix.instance }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        instance: ${{ fromJSON(needs.plan.outputs.instances) }}
    steps:
      - name: Check CPU
        id: cpu
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')
          echo "model=$model"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          if echo "$model" | grep -Eq '${{ inputs.cpu }}'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "::notice::instance ${{ matrix.instance }} drew '$model': profiling"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "::notice::instance ${{ matrix.instance }} drew '$model': not a match, skipping"
          fi

      - name: Checkout code
        if: steps.cpu.outputs.hit == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract configuration
        if: steps.cpu.outputs.hit == 'true'
        id: extract
        uses: ./.github/actions/extract-build-config

      - name: Setup all .NET SDKs
        if: steps.cpu.outputs.hit == 'true'
        uses: ./.github/actions/setup-dotnet-sdks
        with:
          dotnet-version: ${{ steps.extract.outputs.versions }}

      - name: Install perf
        if: steps.cpu.outputs.hit == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common linux-tools-generic "linux-tools-$(uname -r)" || true
          PERF=$(command -v perf || ls /usr/lib/linux-tools/*/perf | tail -1)
          "$PERF" version
          echo "PERF=$PERF" >> "$GITHUB_ENV"
          sudo sysctl -w kernel.perf_event_paranoid=1
          sudo sysctl -w kernel.kptr_restrict=0

      - name: Build benchmarks
        if: steps.cpu.outputs.hit == 'true'
        run: |
          dotnet restore --force-evaluate
          dotnet build benchmarks/HeroParser.Benchmarks/HeroParser.Benchmarks.csproj -c Release -f net10.0 --no-restore

      - name: Profile
        if: steps.cpu.outputs.hit == 'true'
        env:
          # perf cannot see the runtime's JIT code heap (reserved without permissions, committed with
          # mprotect), so samples land in [unknown] and neither the perf map nor the jitdump resolves.
          # Symbolization is done here instead: perf supplies raw instruction pointers, the perf map
          # supplies method ranges, and the hot methods' code bytes are copied out of /proc/<pid>/mem
          # while the process runs so objdump can list them instruction by instruction.
          DOTNET_PerfMapEnabled: '3'
          DOTNET_PerfMapShowOptimizationTiers: '1'
          DOTNET_TieredPGO: '1'
        run: |
          set -euo pipefail
          OUT="$GITHUB_WORKSPACE/profile-out"
          mkdir -p "$OUT"
          echo "${{ steps.cpu.outputs.model }}" > "$OUT/cpu.txt"
          grep -m1 -E '^flags' /proc/cpuinfo | tr ' ' '\n' | grep -E '^avx' | tr '\n' ' ' >> "$OUT/cpu.txt"; echo >> "$OUT/cpu.txt"
          DLL="$GITHUB_WORKSPACE/benchmarks/HeroParser.Benchmarks/bin/Release/net10.0/HeroParser.Benchmarks.dll"
          SECONDS_TOTAL='${{ inputs.seconds }}'
          for CASE in ${{ inputs.cases }}; do
            echo "=== $CASE"
            case "$CASE" in
              hero-*) DUMP_REGEX='CsvRowBatchScanner|CsvRowReader|CsvRowBatchCursor' ;;
              sep-*)  DUMP_REGEX='SepParser|SepReader|nietras' ;;
              *)      DUMP_REGEX='.' ;;
            esac
            CODE="$OUT/$CASE.code"; mkdir -p "$CODE"

            # The driver warms up for 2 s, then loops for SECONDS_TOTAL. Sample from 3 s on so that
            # only tier-1 code is measured, and dump the hot methods' code bytes while it runs.
            dotnet "$DLL" --profile "$CASE" "$SECONDS_TOTAL" > "$OUT/$CASE.timing.txt" &
            PID=$!
            sleep 3
            "$PERF" record -e cpu-clock -F 1999 -p "$PID" -o "$OUT/$CASE.data" -- sleep $((SECONDS_TOTAL - 2)) 2>&1 | tail -1 &
            PERF_PID=$!
            sleep 2
            MAP="/tmp/perf-$PID.map"
            cp "$MAP" "$OUT/$CASE.perfmap"
            (grep -E "$DUMP_REGEX" "$MAP" || true) | while read -r START SIZE NAME; do
              sudo dd if="/proc/$PID/mem" of="$CODE/$START.bin" iflag=skip_bytes,count_bytes skip=$((16#$START)) count=$((16#$SIZE)) status=none 2>/dev/null || true
            done
            echo "code dumps: $(ls "$CODE" | wc -l) methods matching '$DUMP_REGEX'"
            wait "$PERF_PID" || true
            wait "$PID" || true
            cat "$OUT/$CASE.timing.txt" | tee -a "$OUT/timings.txt"

            "$PERF" script -i "$OUT/$CASE.data" -F ip 2>/dev/null | awk '{print $1}' > "$OUT/$CASE.ips"
            echo "sampled ips: $(wc -l < "$OUT/$CASE.ips")"
            python3 "$GITHUB_WORKSPACE/.github/scripts/perf-symbolize.py" "$OUT/$CASE.perfmap" "$OUT/$CASE.ips" "$CODE" 6 > "$OUT/$CASE.profile.txt"
            rm -f "$OUT/$CASE.data" "$OUT/$CASE.ips" "$MAP"
          done
          set +o pipefail
          echo "=== timings"; cat "$OUT/timings.txt"
          for f in "$OUT"/*.profile.txt; do echo "=== $f"; head -60 "$f"; done

      - name: Upload profile
        if: always() && steps.cpu.outputs.hit == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-${{ matrix.instance }}
          path: profile-out/
          retention-days: 14
